name: Gerar APK do Jarvis

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Abrir projeto Android
        run: |
          mkdir projeto
          unzip -q "JarvisAndroid-pronto.zip" -d projeto

          GRADLEW=$(find projeto -name gradlew -type f | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERRO: não encontrei o arquivo gradlew dentro do ZIP."
            exit 1
          fi

          chmod +x "$GRADLEW"

          PROJETO_DIR=$(dirname "$GRADLEW")
          echo "Projeto encontrado em: $PROJETO_DIR"
          echo "PROJETO_DIR=$PROJETO_DIR" >> "$GITHUB_ENV"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        working-directory: ${{ env.PROJETO_DIR }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Procurar APK
        run: |
          find "$PROJETO_DIR" -name "*.apk" -type f

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: |
            **/build/outputs/apk/**/*.apk
